server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # 静态资源与 JSON 响应启用 gzip，主 JS 包由原样传输改为压缩传输
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/javascript text/css application/json image/svg+xml;

    location = /api/healthz {
        proxy_pass http://productflow-backend:29280/healthz;
        proxy_http_version 1.1;
        # $http_host 保留浏览器原始 Host（含端口）：$host 会剥掉端口，
        # 使后端的 Origin/Host 同源比对失败（CSRF 防线误杀正常登录）
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖而非追加：$proxy_add_x_forwarded_for 会保留客户端自报值，可被伪造身份
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://productflow-backend:29280/api/;
        proxy_http_version 1.1;
        # $http_host 保留浏览器原始 Host（含端口）：$host 会剥掉端口，
        # 使后端的 Origin/Host 同源比对失败（CSRF 防线误杀正常登录）
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖而非追加：$proxy_add_x_forwarded_for 会保留客户端自报值，可被伪造身份
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 流式接口：工具执行期间可能长时间无帧，禁止缓冲并放宽空闲读超时
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
